const records=DB.records;const byId=Object.fromEntries(records.map(r=>[r.id,r]));

function filtered(){let q=$('search').value.trim().toLowerCase();return records.filter(r=>(!$('catFilter').value||r.category===$('catFilter').value)&&(!$('typeFilter').value||r.record_type===$('typeFilter').value)&&(!q||[r.category,r.series,r.model,r.structure_original,r.historical_spec_text,r.historical_variants_text,r.application_scenes,r.notes].join(' ').toLowerCase().includes(q)))}
function nodeText(el,x,y,str,cls){let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('class',cls||'');t.textContent=str;el.appendChild(t)}
function edge(layer,x1,y1,x2,y2){let e=document.createElementNS('http://www.w3.org/2000/svg','path');e.setAttribute('d',`M ${x1} ${y1} C ${x1+68} ${y1},${x2-68} ${y2},${x2} ${y2}`);e.setAttribute('class','edge');layer.appendChild(e)}
function createNode(layer,label,x,y,w=220,h=48,kind='model',cb,sub=''){let n=document.createElementNS('http://www.w3.org/2000/svg','g');n.setAttribute('class','node '+kind+(byId[selected.id]&&label===selected.model?' selected':''));let rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',x);rect.setAttribute('y',y);rect.setAttribute('width',w);rect.setAttribute('height',h);rect.setAttribute('rx',10);n.appendChild(rect);nodeText(n,x+13,y+(sub?21:30),label.length>23?label.slice(0,21)+'…':label);if(sub)nodeText(n,x+13,y+41,sub.slice(0,34),'minor');n.addEventListener('click',ev=>{ev.stopPropagation();if(cb)cb()});layer.appendChild(n);return n}
function setCamera(v,x,y){viewScale=Math.max(.3,Math.min(2.6,v));tx=x;ty=y;$('world').setAttribute('transform',`translate(${tx},${ty}) scale(${viewScale})`)}
function fit(w,h){const rect=$('viewport').getBoundingClientRect();let s=Math.max(.3,Math.min(1.3,Math.min((rect.width-40)/w,(rect.height-36)/h)));setCamera(s,(rect.width-w*s)/2,(rect.height-h*s)/2)}
function renderOverview(){mode='overview';$('currentMode').textContent='系列 / 型号';let subset=filtered();if(!subset.length){$('world').replaceChildren();return}
 let layer=$('world');layer.replaceChildren();const categories=[...new Set(subset.map(r=>r.category))];const rootX=20, catX=294, serX=605, mdlX=983;
 const rows=[],catTracks=[],serTracks=[];let cursor=28;
 for(const c of categories){const entries=subset.filter(r=>r.category===c);let categoryStart=cursor;for(const s of [...new Set(entries.map(r=>r.series))]){let seriesStart=cursor;for(const rec of entries.filter(r=>r.series===s)){rows.push({r:rec,y:cursor});cursor+=55}let sy=(seriesStart+cursor-55)/2;serTracks.push({c,s,y:sy})}let cy=(categoryStart+cursor-55)/2;catTracks.push({c,y:cy});cursor+=18}
 const H=Math.max(350,cursor+25),W=1230;let ry=H/2-24;
 createNode(layer,'huangren 历史商品',rootX,ry,222,55,'root',()=>{});
 for(const {c,y} of catTracks){edge(layer,242,ry+28,catX,y+23);createNode(layer,c,catX,y,251,46,'cat',()=>{$('catFilter').value=c;update()})}
 for(const {c,s,y} of serTracks){let ct=catTracks.find(a=>a.c===c);edge(layer,545,ct.y+23,serX,y+23);createNode(layer,s,serX,y,321,47,'series',()=>{})}
 for(const {r,y} of rows){let st=serTracks.find(a=>a.c===r.category&&a.s===r.series);edge(layer,926,st.y+23,mdlX,y+23);createNode(layer,r.model,mdlX,y,240,46,'model',()=>pick(r),r.record_type)}
 fit(W,H)
}
function renderFocus(){mode='focus';$('currentMode').textContent='结构 / 规格 / 变体 / 应用 / 核验';let r=selected,layer=$('world');layer.replaceChildren();const blocks=[

 ['资料与风险',['状态：'+r.evidence_label,...r.review_alerts.slice(0,3)]],

 const W=1320;let Y=40;let positions=[];for(const [title,lines] of blocks){const h=56+Math.min(lines.length,9)*29;positions.push({title,lines,x:680,y:Y,h});Y+=h+20}
 const H=Math.max(590,Y);let centralY=H/2-35;createNode(layer,r.model,70,centralY,278,70,'root',()=>{},r.category+' · '+r.series);for(const b of positions){edge(layer,348,centralY+34,b.x,b.y+24);let height=b.h;const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','node series');let rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',b.x);rect.setAttribute('y',b.y);rect.setAttribute('width',575);rect.setAttribute('height',height);rect.setAttribute('rx',10);g.appendChild(rect);nodeText(g,b.x+15,b.y+23,b.title);b.lines.slice(0,9).forEach((line,i)=>nodeText(g,b.x+15,b.y+51+i*27,line.length>52?line.slice(0,49)+'…':line,'minor'));layer.appendChild(g)}fit(W,H)
}

<h3>应用场景</h3><div class="kv">${escaped(r.application_scenes||'待核')}</div><h3>产品结构审核字段</h3><ul>${r.reference_component_checklist.map(x=>`<li>${escaped(x)}</li>`).join('')}</ul><h3>风险与待核信息</h3><ul>${r.review_alerts.map(x=>`<li>${escaped(x)}</li>`).join('')}</ul><h3>素材与归档状态</h3><p>原产品图：未挂接<br>尺寸图/CAD：未挂接<br>店铺SKU：未挂接<br>来源：历史对话/画册整理（原件未复核）</p><div class="row-buttons"><button class="primary" id="copyRow">复制该型号 JSON</button><button id="focusOne">展开结构脑图</button></div>`;

const vp=$('viewport');vp.addEventListener('wheel',e=>{e.preventDefault();let rect=vp.getBoundingClientRect(),px=e.clientX-rect.left,py=e.clientY-rect.top;let ns=Math.max(.3,Math.min(2.6,viewScale*(e.deltaY<0?1.12:.89)));tx=px-(px-tx)*ns/viewScale;ty=py-(py-ty)*ns/viewScale;setCamera(ns,tx,ty)},{passive:false});
